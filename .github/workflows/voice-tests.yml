name: Native Codex voice
on:
  pull_request:
    paths:
      - 'crates/audio/**'
      - 'crates/proto/src/voice.rs'
      - 'crates/harness/**'
      - 'crates/engine/**'
      - 'crates/ui/**'
      - 'crates/mcp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/voice-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Native audio and GPUI build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev clang libclang-dev pkg-config meson ninja-build libwayland-dev libxkbcommon-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libxrandr-dev libxi-dev libxcursor-dev libx11-dev libxinerama-dev libegl1-mesa-dev libvulkan-dev libfontconfig1-dev libfreetype6-dev libssl-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Protocol, transport and idle runtime (no provider access)
        run: |
          cargo test --locked -p zeron-proto voice --lib
          cargo test --locked -p zeron-harness --lib
          cargo test --locked -p zeron-harness --test codex --test acp
          cargo test --locked -p zeron-doc voice --lib
          cargo test --locked -p zeron-engine --lib voice
          cargo test --locked -p zeron-engine --test voice_runtime
          cargo test --locked -p zeron-mcp --lib
      - name: Native audio and WebRTC AEC3
        run: cargo test --locked -p zeron-audio --features aec --lib
      - name: Orb and voice surface
        run: |
          cargo check --locked -p zeron-ui --features voice-experimental
          cargo test --locked -p zeron-ui --test voice_orb_geometry
          cargo test --locked -p zeron-ui --lib voice

  native-platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile subscription bridge without audio hardware or provider access
        run: cargo check --locked -p zeron-harness -p zeron-engine
